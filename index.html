<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INKANAS NGAWI PRESTASI - Training & Monitoring Center</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f2f4;--panel:#fff;--ink:#161616;--mute:#666b78;--line:#dcdde3;--red:#d4141c;--blk:#141414;--ok:#1f8a5b;--warn:#c98512}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--panel:#1c1c20;--ink:#f2f2f4;--mute:#a0a4b0;--line:#34353c;--red:#ff4b52;--blk:#050505;--ok:#4cc79a;--warn:#f0aa45}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
.bar{background:#141414;color:#fff;border-bottom:4px solid var(--red)}
.bar>div{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar img{width:52px;height:52px;border-radius:50%;flex:none}
.bar h1{margin:0;font-size:1.25rem;line-height:1.2}
.bar p{margin:0;font-size:.8rem;color:#c5c7cf}
.seg{margin-left:auto;display:flex;background:#2a2a2e;border-radius:8px;padding:3px}
.seg button{background:none;border:0;color:#d5d7de;padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.05rem}
.tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mute);font:inherit;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--red);border-color:var(--red);font-weight:600}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-top:2px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:8px}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.cnt{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.meter{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red)}
.rowS{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rowS:last-child{border:0}
.rowS .nm{flex:1;min-width:160px}
.rowS small{display:block;color:var(--mute)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.tag.p{background:var(--red);color:#fff;border-color:var(--red)}
.st{display:flex;gap:4px}
.st button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.82rem}
.st button[aria-pressed="true"]{color:#fff;border-color:transparent}
.st .H[aria-pressed="true"]{background:var(--ok)}.st .I[aria-pressed="true"]{background:var(--warn)}.st .S[aria-pressed="true"]{background:#7a5af0}.st .A[aria-pressed="true"]{background:var(--red)}
.bar2{margin-bottom:12px}
.bar2 div{display:flex;justify-content:space-between;font-size:.88rem}
.bar2 .meter{height:10px;margin-top:3px}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.av{width:60px;height:60px;border-radius:12px;background:var(--blk);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.3rem;border:2px solid var(--red);flex:none}
.big{font-size:1.5rem;font-weight:700}
.empty{color:var(--mute);padding:12px 0}
.hide{display:none}
.note{background:var(--bg);border-left:4px solid var(--red);padding:10px 12px;border-radius:4px}
.msg{color:var(--ok);font-size:.88rem;min-height:1.3em;margin-top:6px}
.msg.err{color:var(--red)}
input[type=range]{padding:0;accent-color:var(--red)}
.ptabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.ptabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mute);font:inherit;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--red);border-color:var(--red);font-weight:600}
.chart{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lg{font-size:.85rem;display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.strip{display:flex;gap:3px;margin-top:10px}.strip span{flex:1;height:18px;border-radius:3px;max-width:34px}
.scroll{overflow-x:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}.two .panel{margin:0}
.ev{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px}
.ev small{display:block;color:var(--mute)}
.cd{text-align:center;min-width:64px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;align-self:flex-start}
.cd b{display:block;font-size:1.2rem;color:var(--red)}.cd span{font-size:.72rem;color:var(--mute)}
.ach{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px}
.ach .m{font-size:1.5rem}.ach small{display:block;color:var(--mute)}.ach .x{margin-left:auto}
.nws{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:6px;background:var(--bg);margin-bottom:8px}
.nws>div{display:flex;justify-content:space-between;gap:8px}.nws p{margin:4px 0 0;font-size:.9rem}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:14px}.three .panel{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.fi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.fi small{display:block;color:var(--mute)}.fi b{display:block;font-size:1.25rem}.fi .ok{color:var(--ok)}
</style>
</head>

<div><h1>INKANAS NGAWI PRESTASI</h1><p>Training & Monitoring Center</p></div>
<div class="seg" role="group" aria-label="Mode tampilan">
<button id="mP" aria-pressed="true">Orang tua</button><button id="mC" aria-pressed="false">Pelatih</button>
</div></div></div>

<main>
<!-- ORANG TUA -->
<section id="vP">
<div class="panel"><label>Pilih murid<select id="pSel"></select></label></div>
<div class="ptabs"><button data-p="dev" aria-selected="true">Perkembangan</button><button data-p="inf" aria-selected="false">Info &amp; prestasi</button></div>
<div id="pBody"></div><div id="pInfo" class="hide"></div>
</section>

<!-- PELATIH -->
<section id="vC" class="hide">
<div class="tabs" role="tablist">
<button role="tab" data-t="reg" aria-selected="true">Pendaftaran & daftar murid</button>
<button role="tab" data-t="att" aria-selected="false">Presensi</button>
<button role="tab" data-t="ev" aria-selected="false">Evaluasi</button>
<button role="tab" data-t="inf" aria-selected="false">Info &amp; prestasi</button>
</div>

<div id="t-reg">
<div class="panel">
<div class="cnt"><b id="cnt">0 / 50</b><div class="meter"><i id="cm" style="width:0"></i></div><span id="cl" style="color:var(--mute);font-size:.85rem"></span></div>
<h2>Daftarkan murid baru</h2>
<div class="grid">
<label>Nama lengkap<input id="rn" maxlength="60" autocomplete="off"></label>
<label>Usia (tahun)<input id="ra" type="number" min="4" max="60"></label>
<label>Kategori<select id="rc"><option>Kelas Pemula</option><option>Kelas Reguler</option><option>Kelas Prestasi</option></select></label>
<label>Sabuk<select id="rb"></select></label>
<label>Nama orang tua / wali<input id="rw" maxlength="60"></label>
<label>No. WhatsApp wali<input id="rp" inputmode="tel" maxlength="20"></label>
</div>
<button class="btn" id="rAdd">Daftarkan murid</button>
<div id="rMsg" class="msg" role="status"></div>
</div>
<div class="panel"><h2>Daftar murid</h2>
<div class="grid" style="margin-bottom:8px"><input id="q" placeholder="Cari nama…" aria-label="Cari nama"><select id="fc" aria-label="Filter kategori"><option value="">Semua kategori</option><option>Kelas Pemula</option><option>Kelas Reguler</option><option>Kelas Prestasi</option></select></div>
<div id="list"></div></div>
</div>

<div id="t-inf" class="hide">
<div class="panel"><h2>Agenda kejuaraan & UKT</h2>
<div class="grid"><label>Jenis<select id="ety"><option>Kejuaraan</option><option>UKT</option><option>Lainnya</option></select></label>
<label>Judul<input id="et" maxlength="80"></label><label>Tanggal<input type="date" id="ed"></label><label>Tempat<input id="ep" maxlength="60"></label></div>
<label>Catatan<input id="eno" maxlength="120"></label><button class="btn" id="eAdd">Tambah agenda</button>
<div id="evList" style="margin-top:12px"></div></div>
<div class="panel"><h2>Papan pengumuman</h2>
<label>Judul<input id="nt" maxlength="80"></label><label>Isi pengumuman<textarea id="nx" rows="2" maxlength="400"></textarea></label>
<button class="btn" id="nAdd">Tambah pengumuman</button><div id="nwList" style="margin-top:12px"></div></div>
<div class="panel"><h2>Prestasi murid</h2>
<label>Murid<select id="iSel"></select></label>
<div class="grid"><label>Prestasi<input id="at" maxlength="80" placeholder="Juara 1 Kata Perorangan"></label><label>Ajang<input id="ae" maxlength="80"></label>
<label>Jenis<select id="am"><option>Emas</option><option>Perak</option><option>Perunggu</option><option>Sabuk</option><option>Penghargaan</option></select></label><label>Tanggal<input type="date" id="ad2"></label></div>
<button class="btn" id="aAdd">Simpan prestasi</button><div id="acList" style="margin-top:12px"></div></div>
</div>
<div id="t-att" class="hide">
<div class="panel"><h2>Presensi latihan</h2>
<label style="max-width:220px">Tanggal sesi<input type="date" id="ad"></label>
<div id="attChart"></div><div id="attList"></div></div>
</div>

<div id="t-ev" class="hide">
<div class="panel"><h2>Evaluasi murid</h2>
<label>Pilih murid<select id="eSel"></select></label>
<div id="eForm"></div><div id="eChart"></div></div>
</div>
</section>
</main>

<script>
var MAX=50,KEY="dojonas-ngawi-v1",BELT=["Putih","Kuning","Hijau","Biru","Coklat","Hitam"];
var SK=[["kihon","Kihon (teknik dasar)"],["kata","Kata (jurus)"],["kumite","Kumite (tarung)"],["karakter","Disiplin & karakter"]];
var D={students:[]},cur=null,$=function(i){return document.getElementById(i)};
function load(){try{var r=localStorage.getItem(KEY);if(r)D=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ini(n){return n.split(/\s+/).slice(0,2).map(function(w){return w[0]||""}).join("").toUpperCase()}
function byId(id){return D.students.filter(function(s){return s.id===id})[0]}
function pct(s){var k=Object.keys(s.att),h=k.filter(function(d){return s.att[d]==="H"}).length;return k.length?Math.round(h/k.length*100):null}
function cnt(s,c){return Object.keys(s.att).filter(function(d){return s.att[d]===c}).length}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fmt(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function avg(s){if(!s.sc)return null;var v=SK.map(function(k){return s.sc[k[0]]});return Math.round(v.reduce(function(a,b){return a+b},0)/v.length)}

/* mode & tab */
function mode(m){var c=m==="c";$("vP").classList.toggle("hide",c);$("vC").classList.toggle("hide",!c);
$("mP").setAttribute("aria-pressed",!c);$("mC").setAttribute("aria-pressed",c);renderAll()}
$("mP").onclick=function(){mode("p")};$("mC").onclick=function(){mode("c")};
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){
document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected",x===b);$("t-"+x.dataset.t).classList.toggle("hide",x!==b)});renderAll()}});

/* pendaftaran */
$("rb").innerHTML=BELT.map(function(b,i){return '<option value="'+i+'">'+b+'</option>'}).join("");
$("rAdd").onclick=function(){
var n=$("rn").value.trim(),m=$("rMsg");m.className="msg";
if(D.students.length>=MAX){m.className="msg err";m.textContent="Kuota "+MAX+" murid sudah penuh.";return}
if(!n){m.className="msg err";m.textContent="Nama murid wajib diisi.";return}
var s={id:Math.random().toString(36).slice(2,9),name:n,age:$("ra").value,cat:$("rc").value,belt:+$("rb").value,wali:$("rw").value.trim(),hp:$("rp").value.trim(),reg:today(),att:{},sc:null,note:"",focus:""};
D.students.push(s);D.students.sort(function(a,b){return a.name.localeCompare(b.name)});cur=s.id;save();
["rn","ra","rw","rp"].forEach(function(i){$(i).value=""});m.textContent=n+" terdaftar sebagai "+s.cat+".";renderAll()};

function renderReg(){
var n=D.students.length;$("cnt").textContent=n+" / "+MAX;$("cm").style.width=(n/MAX*100)+"%";
$("cl").textContent=n>=MAX?"Kuota penuh":"Sisa "+(MAX-n)+" tempat";$("rAdd").disabled=n>=MAX;
var q=$("q").value.toLowerCase(),f=$("fc").value;
var L=D.students.filter(function(s){return s.name.toLowerCase().indexOf(q)>-1&&(!f||s.cat===f)});
$("list").innerHTML=!n?'<p class="empty">Belum ada murid. Isi formulir di atas setiap ada anak yang mendaftar ke INKANAS Ngawi Prestasi.</p>':!L.length?'<p class="empty">Tidak ada murid yang cocok.</p>':
L.map(function(s){return '<div class="rowS"><span class="av" style="width:40px;height:40px;font-size:.95rem;border-radius:8px">'+esc(ini(s.name))+'</span><div class="nm">'+esc(s.name)+'<small>'+(s.age?s.age+' thn · ':'')+'Sabuk '+BELT[s.belt]+' · daftar '+fmt(s.reg)+'</small></div><span class="tag'+(s.cat==="Kelas Prestasi"?" p":"")+'">'+s.cat+'</span><button class="btn alt" data-del="'+s.id+'">Hapus</button></div>'}).join("");
document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){var s=byId(b.dataset.del);
if(confirm("Hapus "+s.name+" beserta seluruh datanya?")){D.students=D.students.filter(function(x){return x!==s});save();renderAll()}}})}
$("q").oninput=renderReg;$("fc").onchange=renderReg;

/* presensi */
$("ad").value=today();$("ad").onchange=renderAtt;
function renderAtt(){var d=$("ad").value||today();$("attChart").innerHTML=classChart(d);
$("attList").innerHTML=!D.students.length?'<p class="empty">Belum ada murid terdaftar.</p>':D.students.map(function(s){var v=s.att[d];
return '<div class="rowS"><div class="nm">'+esc(s.name)+'<small>'+s.cat+'</small></div><div class="st">'+[["H","Hadir"],["I","Izin"],["S","Sakit"],["A","Alpa"]].map(function(x){return '<button class="'+x[0]+'" data-s="'+s.id+'" data-v="'+x[0]+'" aria-pressed="'+(v===x[0])+'">'+x[1]+'</button>'}).join("")+'</div></div>'}).join("");
document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var s=byId(b.dataset.s);s.att[d]=b.dataset.v;save();renderAtt()}})}

/* evaluasi */
function fillSel(el,keep){el.innerHTML=D.students.length?D.students.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+' ('+s.cat+')</option>'}).join(""):'<option value="">Belum ada murid</option>';
if(keep&&byId(keep))el.value=keep;else if(D.students.length)el.value=D.students[0].id}
var GR=[["kata","Evaluasi teknik Kata","var(--red)",["Stabilitas (zero-shaking)","Ledakan tenaga (kime)","Presisi arah (embusen)"]],["kumite","Evaluasi taktik Kumite","var(--ink)",["Timing & reaksi serang","Eksplosivitas langkah","Kelincahan (footwork)"]],["eq","Karakter & emosi (EQ)","var(--warn)",["Kontrol emosi & tenang","Kedisiplinan & fokus","Sportivitas & respek"]]];
var FL=["Leg press (55% 1RM)","Keseimbangan 1 kaki","Kelenturan (split)","Durasi latihan ideal"],FS=["Optimal","Perlu dipantau","Masa pemulihan"];
function mean(a){return Math.round(a.reduce(function(x,y){return x+y},0)/a.length)}
function getDt(s){var o={},d=s.dt||{},sc=s.sc||{kata:70,kumite:70,karakter:70};GR.forEach(function(g){var v=g[0]==="eq"?sc.karakter:sc[g[0]];o[g[0]]=d[g[0]]||[v,v,v]});return o}
function getFis(s){var f=s.fis||{status:FS[0],items:[]},it=[];for(var i=0;i<4;i++)it.push(f.items[i]||{label:FL[i],value:"",note:""});return{status:f.status,items:it}}
function detailHTML(s){if(!s.sc)return '';var d=getDt(s);
return '<div class="three">'+GR.map(function(g){return '<div class="panel"><div class="top"><b><span style="color:'+g[2]+'">●</span> '+g[1]+'</b><span class="tag">'+mean(d[g[0]])+'/100</span></div>'+g[3].map(function(n,i){var v=d[g[0]][i];return '<div class="bar2"><div><span>'+n+'</span><b>'+v+'%</b></div><div class="meter"><i style="width:'+v+'%;background:'+g[2]+'"></i></div></div>'}).join("")+'</div>'}).join("")+'</div>'}
function fisHTML(s){if(!s.fis)return '';var f=getFis(s),it=f.items.filter(function(x){return x.value});if(!it.length)return '';
return '<div class="panel"><div class="top"><div><h2 style="margin:0">Indikator kebugaran & latihan beban</h2><small style="color:var(--mute)">Pemantauan beban latihan yang aman sesuai usia</small></div><span class="tag" style="color:var(--ok);border-color:var(--ok)">Kondisi fisik: '+esc(f.status)+'</span></div><div class="grid">'+it.map(function(x){return '<div class="fi"><small>'+esc(x.label)+'</small><b>'+esc(x.value)+'</b>'+(x.note?'<small class="ok">'+esc(x.note)+'</small>':'')+'</div>'}).join("")+'</div></div>'}
function renderEv(){fillSel($("eSel"),cur);var s=byId($("eSel").value);cur=s?s.id:null;
$("eChart").innerHTML=s?evChart(s):"";
if(!s){$("eForm").innerHTML='<p class="empty">Daftarkan murid terlebih dahulu.</p>';return}
var kh=s.sc?s.sc.kihon:70,dt=getDt(s),fs=getFis(s),sl=function(id,n,v){return '<label>'+n+': <b id="l_'+id+'">'+v+'</b><input type="range" min="0" max="100" id="r_'+id+'" value="'+v+'"></label>'};
var h='<div class="grid">'+sl("k","Kihon (teknik dasar)",kh)+'</div>';
GR.forEach(function(g){h+='<h2 style="margin-top:14px">'+g[1]+'</h2><div class="grid">'+g[3].map(function(n,i){return sl(g[0]+i,n,dt[g[0]][i])}).join("")+'</div>'});
h+='<h2 style="margin-top:14px">Indikator kebugaran & latihan beban</h2><label style="max-width:260px">Kondisi fisik<select id="fst">'+FS.map(function(x){return '<option'+(x===fs.status?' selected':'')+'>'+x+'</option>'}).join("")+'</select></label>';
fs.items.forEach(function(it,i){h+='<div class="grid"><label>Indikator<input id="fl'+i+'" maxlength="40" value="'+esc(it.label)+'"></label><label>Hasil<input id="fv'+i+'" maxlength="30" placeholder="contoh: 35 kg" value="'+esc(it.value)+'"></label><label>Keterangan<input id="fn'+i+'" maxlength="60" value="'+esc(it.note)+'"></label></div>'});
h+='<label>Fokus latihan minggu ini<input id="ef" value="'+esc(s.focus)+'"></label><label>Catatan untuk orang tua<textarea id="en" rows="3">'+esc(s.note)+'</textarea></label><button class="btn" id="eSave">Simpan evaluasi</button><div id="eMsg" class="msg" role="status"></div>';
$("eForm").innerHTML=h;
document.querySelectorAll("#eForm input[type=range]").forEach(function(r){r.oninput=function(){$("l_"+r.id.slice(2)).textContent=r.value}});
$("eSave").onclick=function(){var g=function(id){return +$("r_"+id).value},d={};
GR.forEach(function(x){d[x[0]]=[g(x[0]+0),g(x[0]+1),g(x[0]+2)]});
s.dt=d;s.sc={kihon:g("k"),kata:mean(d.kata),kumite:mean(d.kumite),karakter:mean(d.eq)};
s.fis={status:$("fst").value,items:[0,1,2,3].map(function(i){return{label:$("fl"+i).value.trim(),value:$("fv"+i).value.trim(),note:$("fn"+i).value.trim()}})};
s.focus=$("ef").value;s.note=$("en").value;s.upd=today();
s.hist=(s.hist||[]).filter(function(x){return x.d!==today()});s.hist.push({d:today(),sc:JSON.parse(JSON.stringify(s.sc))});
save();$("eChart").innerHTML=evChart(s);$("eMsg").textContent="Evaluasi "+s.name+" tersimpan dan tampil di halaman orang tua."}}
$("eSel").onchange=function(){cur=this.value;renderEv()};

/* orang tua */
$("pSel").onchange=function(){cur=this.value;renderP();renderInf()};
function renderP(){fillSel($("pSel"),cur);var s=byId($("pSel").value);cur=s?s.id:null;
if(!s){$("pBody").innerHTML='<div class="panel"><p class="empty">Data murid akan tampil di sini setelah pelatih mendaftarkan anak ke INKANAS Ngawi Prestasi.</p></div>';return}
var p=pct(s),a=avg(s);
$("pBody").innerHTML='<div class="panel"><div class="hero"><span class="av">'+esc(ini(s.name))+'</span><div style="flex:1;min-width:180px"><span class="tag p">'+s.cat+'</span> <span class="tag">Sabuk '+BELT[s.belt]+'</span><div class="big">'+esc(s.name)+'</div><small style="color:var(--mute)">'+(s.age?s.age+' tahun · ':'')+'Terdaftar '+fmt(s.reg)+'</small></div><div style="text-align:center"><div class="big">'+(p===null?"–":p+"%")+'</div><small style="color:var(--mute)">kehadiran</small></div><div style="text-align:center"><div class="big">'+(a===null?"–":a)+'</div><small style="color:var(--mute)">nilai rata-rata</small></div></div></div>'+
'<div class="panel"><h2>Perkembangan kemampuan</h2>'+evChart(s)+(s.sc?SK.map(function(k){var v=s.sc[k[0]];return '<div class="bar2"><div><span>'+k[1]+'</span><b>'+v+'</b></div><div class="meter"><i style="width:'+v+'%"></i></div></div>'}).join(""):'<p class="empty">Belum ada evaluasi dari pelatih.</p>')+'</div>'+
detailHTML(s)+fisHTML(s)+'<div class="panel"><h2>Catatan pelatih</h2>'+(s.note||s.focus?(s.focus?'<p><b>Fokus minggu ini:</b> '+esc(s.focus)+'</p>':'')+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+(s.upd?'<small style="color:var(--mute)">Diperbarui '+fmt(s.upd)+'</small>':''):'<p class="empty">Belum ada catatan.</p>')+'</div>'+
attChart(s)+'<div class="panel"><h2>Riwayat presensi</h2><p>Hadir '+cnt(s,"H")+' · Izin '+cnt(s,"I")+' · Sakit '+cnt(s,"S")+' · Alpa '+cnt(s,"A")+'</p>'+
Object.keys(s.att).sort().reverse().slice(0,8).map(function(d){return '<div class="rowS"><span class="nm">'+fmt(d)+'</span><span class="tag">'+{H:"Hadir",I:"Izin",S:"Sakit",A:"Alpa"}[s.att[d]]+'</span></div>'}).join("")+'</div>'}

function renderAll(){renderReg();renderAtt();renderEv();renderP();renderInf()}
/* diagram */
var CL=["var(--ok)","var(--warn)","#7a5af0","var(--red)"],CN=["Hadir","Izin","Sakit","Alpa"],CK=["H","I","S","A"],EC=["var(--red)","#3b82f6","var(--ok)","var(--warn)"];
function uid(){return Math.random().toString(36).slice(2,9)}
function donut(v){var t=v[0]+v[1]+v[2]+v[3];if(!t)return '<p class="empty">Belum ada data presensi.</p>';
var o=0,g='';v.forEach(function(n,i){var l=n/t*251.2;g+='<circle r="40" cx="50" cy="50" fill="none" stroke="'+CL[i]+'" stroke-width="16" stroke-dasharray="'+l+' '+(251.2-l)+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 50 50)"/>';o+=l});
return '<div class="chart"><svg viewBox="0 0 100 100" width="150" height="150" role="img" aria-label="Diagram presensi">'+g+'<text x="50" y="49" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">'+Math.round(v[0]/t*100)+'%</text><text x="50" y="62" text-anchor="middle" font-size="8" fill="var(--mute)">hadir</text></svg><div>'+CN.map(function(n,i){return '<div class="lg"><i style="background:'+CL[i]+'"></i>'+n+': <b>'+v[i]+'</b></div>'}).join("")+'</div></div>'}
function attChart(s){var v=CK.map(function(k){return cnt(s,k)}),ds=Object.keys(s.att).sort().slice(-12);
var st=ds.length?'<div class="strip">'+ds.map(function(d){return '<span title="'+fmt(d)+'" style="background:'+CL[CK.indexOf(s.att[d])]+'"></span>'}).join("")+'</div><small style="color:var(--mute)">12 sesi terakhir (kiri lama, kanan terbaru)</small>':'';
return '<div class="panel"><h2>Diagram kehadiran</h2>'+donut(v)+st+'</div>'}
function classChart(d){var v=[0,0,0,0],all={};
D.students.forEach(function(s){var x=s.att[d];if(x)v[CK.indexOf(x)]++;Object.keys(s.att).forEach(function(k){all[k]=1})});
var ds=Object.keys(all).sort().slice(-8),bars='';
if(ds.length){var W=360,H=125,bw=W/ds.length;
ds.forEach(function(k,i){var h=0,n=0;D.students.forEach(function(s){if(s.att[k]){n++;if(s.att[k]==="H")h++}});var p=Math.round(h/n*100),bh=p*.85;
bars+='<rect x="'+(i*bw+8)+'" y="'+(100-bh)+'" width="'+(bw-16)+'" height="'+bh+'" rx="3" fill="var(--red)"/><text x="'+(i*bw+bw/2)+'" y="'+(95-bh)+'" font-size="10" text-anchor="middle" fill="var(--ink)">'+p+'%</text><text x="'+(i*bw+bw/2)+'" y="115" font-size="9" text-anchor="middle" fill="var(--mute)">'+fmt(k).slice(0,5)+'</text>'});
bars='<h2 style="margin-top:14px;font-size:.95rem">Tingkat kehadiran per sesi</h2><div class="scroll"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:520px;min-width:300px" role="img" aria-label="Diagram kehadiran per sesi">'+bars+'</svg></div>'}
return '<div style="margin-bottom:12px"><b>Ringkasan sesi '+fmt(d)+'</b>'+donut(v)+bars+'</div>'}
function evChart(s){if(!s.sc)return '';
var cx=110,cy=100,R=70,pts=[],ax='';
SK.forEach(function(k,i){var a=(-90+i*90)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),r=s.sc[k[0]]/100;
ax+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="var(--line)"/>';pts.push((cx+R*r*Math.cos(a))+","+(cy+R*r*Math.sin(a)));
ax+='<text x="'+(cx+(R+14)*Math.cos(a))+'" y="'+(cy+(R+14)*Math.sin(a)+4)+'" font-size="10" text-anchor="middle" fill="var(--mute)">'+k[0]+' '+s.sc[k[0]]+'</text>'});
var rings=[.5,1].map(function(f){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+R*f+'" fill="none" stroke="var(--line)"/>'}).join("");
var radar='<svg viewBox="-10 0 240 200" style="width:100%;max-width:260px" role="img" aria-label="Diagram radar kemampuan">'+rings+ax+'<polygon points="'+pts.join(" ")+'" fill="var(--red)" fill-opacity=".25" stroke="var(--red)" stroke-width="2"/></svg>';
var h=(s.hist||[]).slice(-8),line='';
if(h.length>=2){var W=360,H=170,n=h.length,X=function(i){return 28+(W-40)*i/(n-1)},Y=function(v){return 10+130*(1-v/100)},g='';
[0,50,100].forEach(function(v){g+='<line x1="28" x2="'+(W-12)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="2" y="'+(Y(v)+4)+'" font-size="9" fill="var(--mute)">'+v+'</text>'});
SK.forEach(function(k,j){g+='<polyline fill="none" stroke="'+EC[j]+'" stroke-width="2" points="'+h.map(function(e,i){return X(i)+","+Y(e.sc[k[0]])}).join(" ")+'"/>'});
g+=h.map(function(e,i){return '<text x="'+X(i)+'" y="160" font-size="9" text-anchor="middle" fill="var(--mute)">'+fmt(e.d).slice(0,5)+'</text>'}).join("");
line='<div class="scroll"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:300px;max-width:520px" role="img" aria-label="Diagram riwayat evaluasi">'+g+'</svg></div><div class="chips">'+SK.map(function(k,j){return '<span class="lg"><i style="background:'+EC[j]+'"></i>'+k[0]+'</span>'}).join("")+'</div>'}
else line='<p class="empty">Grafik riwayat muncul setelah ada 2 evaluasi di tanggal berbeda.</p>';
return '<div class="chart" style="align-items:flex-start;margin-bottom:12px">'+radar+'<div style="flex:1;min-width:300px"><b>Riwayat evaluasi</b>'+line+'</div></div>'}

/* info & prestasi */
var MD={Emas:"🥇",Perak:"🥈",Perunggu:"🥉",Sabuk:"🥋",Penghargaan:"🏅"};
function dl(d){return Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5)}
function agendaHTML(del){var E=D.events.slice().sort(function(a,b){return a.date<b.date?-1:1});
return E.length?'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+E.map(function(e){var n=dl(e.date);
return '<div class="ev"><div><span class="tag'+(e.type==="UKT"?"":" p")+'">'+esc(e.type)+'</span><div><b>'+esc(e.title)+'</b></div><small>'+fmt(e.date)+(e.place?' · '+esc(e.place):'')+'</small>'+(e.note?'<small>'+esc(e.note)+'</small>':'')+(del?'<div style="margin-top:6px"><button class="btn alt" data-de="'+e.id+'">Hapus</button></div>':'')+'</div><div class="cd"><b>'+(n<0?"Selesai":n===0?"Hari ini":n)+'</b>'+(n>0?'<span>hari lagi</span>':'')+'</div></div>'}).join("")+'</div>':'<p class="empty">Belum ada agenda.</p>'}
function newsHTML(del){var N=D.news.slice().sort(function(a,b){return a.date<b.date?1:-1});
return N.length?N.map(function(n){return '<div class="nws"><div><b>'+esc(n.title)+'</b><small style="color:var(--mute)">'+fmt(n.date)+'</small></div><p>'+esc(n.text)+'</p>'+(del?'<button class="btn alt" style="margin-top:6px" data-dn="'+n.id+'">Hapus</button>':'')+'</div>'}).join(""):'<p class="empty">Belum ada pengumuman.</p>'}
function achHTML(s,del){var A=(s.ach||[]).slice().sort(function(a,b){return(a.date||"")<(b.date||"")?1:-1});
return A.length?A.map(function(a){return '<div class="ach"><span class="m">'+(MD[a.medal]||"🏅")+'</span><div><b>'+esc(a.title)+'</b><small>'+esc(a.event||"")+(a.date?' · '+fmt(a.date):'')+'</small></div>'+(del?'<button class="btn alt x" data-da="'+s.id+'|'+a.id+'">Hapus</button>':'')+'</div>'}).join(""):'<p class="empty">Belum ada prestasi tercatat.</p>'}
function renderInf(){var s=byId(cur);
$("pInfo").innerHTML='<div class="panel"><h2>Agenda kejuaraan & ujian kenaikan tingkat</h2>'+agendaHTML()+'</div><div class="two"><div class="panel"><h2>Riwayat prestasi'+(s?' · '+esc(s.name):'')+'</h2>'+(s?achHTML(s):'<p class="empty">Belum ada murid.</p>')+'</div><div class="panel"><h2>Papan pengumuman</h2>'+newsHTML()+'</div></div>';
$("evList").innerHTML=agendaHTML(1);$("nwList").innerHTML=newsHTML(1);
fillSel($("iSel"),$("iSel").value||cur);var c=byId($("iSel").value);$("acList").innerHTML=c?achHTML(c,1):'<p class="empty">Belum ada murid.</p>';
document.querySelectorAll("[data-de]").forEach(function(b){b.onclick=function(){D.events=D.events.filter(function(e){return e.id!==b.dataset.de});save();renderInf()}});
document.querySelectorAll("[data-dn]").forEach(function(b){b.onclick=function(){D.news=D.news.filter(function(e){return e.id!==b.dataset.dn});save();renderInf()}});
document.querySelectorAll("[data-da]").forEach(function(b){b.onclick=function(){var x=b.dataset.da.split("|"),st=byId(x[0]);st.ach=st.ach.filter(function(a){return a.id!==x[1]});save();renderInf()}})}
$("iSel").onchange=renderInf;
$("eAdd").onclick=function(){var t=$("et").value.trim(),d=$("ed").value;if(!t||!d)return;D.events.push({id:uid(),type:$("ety").value,title:t,date:d,place:$("ep").value.trim(),note:$("eno").value.trim()});["et","ep","eno"].forEach(function(i){$(i).value=""});save();renderInf()};
$("nAdd").onclick=function(){var t=$("nt").value.trim();if(!t)return;D.news.push({id:uid(),date:today(),title:t,text:$("nx").value.trim()});$("nt").value="";$("nx").value="";save();renderInf()};
$("aAdd").onclick=function(){var s=byId($("iSel").value),t=$("at").value.trim();if(!s||!t)return;(s.ach=s.ach||[]).push({id:uid(),title:t,event:$("ae").value.trim(),medal:$("am").value,date:$("ad2").value});$("at").value="";$("ae").value="";save();renderInf()};
document.querySelectorAll(".ptabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll(".ptabs button").forEach(function(x){x.setAttribute("aria-selected",x===b)});$("pBody").classList.toggle("hide",b.dataset.p!=="dev");$("pInfo").classList.toggle("hide",b.dataset.p!=="inf")}});
load();D.events=D.events||[];D.news=D.news||[];renderAll();
</script>
</body>
</html>
